<div class="modal-overlay" *ngIf="show" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Crear Nueva Reunión</h2>
      <button class="close-btn" (click)="closeModal()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label for="title">Título de la reunión *</label>
        <input 
          type="text" 
          id="title" 
          [(ngModel)]="meetingData.title" 
          placeholder="Ej: Reunión de equipo semanal"
          class="form-input"
        >
      </div>

      <div class="form-group">
        <label for="description">Descripción</label>
        <textarea 
          id="description" 
          [(ngModel)]="meetingData.description" 
          placeholder="Describe el propósito de la reunión..."
          class="form-textarea"
          rows="3"
        ></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="date">Fecha *</label>
          <input 
            type="date" 
            id="date" 
            [(ngModel)]="meetingData.date" 
            class="form-input"
          >
        </div>

        <div class="form-group">
          <label for="time">Hora *</label>
          <input 
            type="time" 
            id="time" 
            [(ngModel)]="meetingData.time" 
            class="form-input"
          >
        </div>
      </div>

      <div class="form-group">
        <label for="duration">Duración</label>
        <select id="duration" [(ngModel)]="meetingData.duration" class="form-select">
          <option *ngFor="let duration of getDurationOptions()" [value]="duration">
            {{ duration }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="location">Ubicación</label>
        <input 
          type="text" 
          id="location" 
          [(ngModel)]="meetingData.location" 
          placeholder="Ej: Videollamada, Sala de juntas, etc."
          class="form-input"
        >
      </div>

      <div class="form-group">
        <label>Participantes</label>
        <div class="participants-input">
          <input 
            type="text" 
            [(ngModel)]="participantInput" 
            placeholder="Nombre del participante"
            class="form-input"
            (keyup.enter)="addParticipant()"
          >
          <button class="add-participant-btn" (click)="addParticipant()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>
        
        <div class="participants-list" *ngIf="meetingData.participants.length > 0">
          <div *ngFor="let participant of meetingData.participants; let i = index" class="participant-tag">
            <span>{{ participant }}</span>
            <button class="remove-participant-btn" (click)="removeParticipant(i)">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" (click)="closeModal()">Cancelar</button>
      <button class="btn-primary" (click)="createMeeting()">Crear Reunión</button>
    </div>
  </div>
</div>
